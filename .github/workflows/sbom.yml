name: SBOM & Vulnerability Scan

on:
  push:
    branches: ["release/*"]
  pull_request:
    branches: ["release/*"]
  workflow_dispatch:

jobs:
  sbom:
    name: Generate SBOM and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build deployer_helm base image
        run: |
          docker build -t deployer-helm:local \
            --build-arg VERSION=local \
            -f marketplace/deployer_helm_base/Dockerfile .

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: deployer-helm:local
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Scan vulnerabilities (Grype)
        uses: anchore/scan-action@v6
        with:
          image: deployer-helm:local
          fail-build: false
          output-format: table

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-deployer-helm
          path: sbom.cdx.json
          retention-days: 90
